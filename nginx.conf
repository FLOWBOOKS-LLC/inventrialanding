server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Compression (helps Core Web Vitals) ---
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # --- Long-lived caching for hashed build assets ---
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # --- Never index API responses ---
  location /api/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # --- SPA + pre-rendered per-route HTML ---
  # /about      -> /about/index.html (generated at build time)
  # unknown URL -> app shell with HTTP 404 status (app renders a noindex 404 page)
  location / {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 =404 /index.html;

  # Basic security headers that do not interfere with existing features
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
